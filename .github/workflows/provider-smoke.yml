name: Provider Smoke

on:
  workflow_dispatch:

jobs:
  openai-compatible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Initialize test workspace
        run: gca init .
      - name: Test Provider health
        run: gca providers test . --json
        env:
          GCA_LLM_PROVIDER: openai-compatible
          GCA_LLM_MODEL: gpt-4.1-mini
          GCA_LLM_API_KEY: ${{ secrets.GCA_LLM_API_KEY }}
