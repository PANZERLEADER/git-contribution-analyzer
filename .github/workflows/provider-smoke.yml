name: Provider Smoke

on:
  workflow_dispatch:

jobs:
  openai-compatible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Initialize test workspace
        run: gca init .
      - name: Test Provider health
        run: gca providers test . --json
        env:
          GCA_LLM_PROVIDER: openai-compatible
          GCA_LLM_MODEL: gpt-4.1-mini
          GCA_LLM_API_KEY: ${{ secrets.GCA_LLM_API_KEY }}
