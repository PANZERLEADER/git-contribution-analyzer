name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src --exclude "adapters/gui"
      - name: Test with coverage
        run: >-
          python -m pytest --ignore-glob="*gui*"
          --cov=git_contribution_analyzer --cov-report=term-missing
          --cov-fail-under=0
      - name: Enforce total core coverage
        run: >-
          python -m coverage report
          --omit="src/git_contribution_analyzer/adapters/gui/*,src/git_contribution_analyzer/application/facades/*"
          --fail-under=80
      - name: Enforce application and domain coverage
        run: >-
          python -m coverage report
          --include="src/git_contribution_analyzer/application/*,src/git_contribution_analyzer/domain/*"
          --omit="src/git_contribution_analyzer/application/facades/*"
          --fail-under=90
      - name: Build package
        run: python -m build
      - name: Verify isolated wheel lifecycle
        run: python scripts/verify_wheel.py
      - name: CLI smoke test
        run: gca --help

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install GUI dependencies
        run: python -m pip install -e ".[dev,gui]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Run GUI tests
        run: python -m pytest -k gui
      - name: GUI entrypoint smoke
        run: python -m pytest tests/e2e/test_gui_smoke.py
      - name: GUI version
        run: gca-gui --version

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: >-
          curl -sSfL
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          | tar -xz -C "${RUNNER_TEMP}" gitleaks
      - name: Scan repository history for credentials
        shell: bash
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --verbose .'
