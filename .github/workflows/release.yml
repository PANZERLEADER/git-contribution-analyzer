name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gca-windows-x86_64
            standalone_source: dist/gca.exe
            release_asset: dist/gca-windows-x86_64.exe
            gui_source: dist/gca-gui.exe
            gui_release_asset: dist/gca-gui-windows-x86_64.exe
          - os: ubuntu-latest
            artifact: gca-linux-x86_64
            standalone_source: dist/gca
            release_asset: dist/gca-linux-x86_64
            gui_source: dist/gca-gui
            gui_release_asset: dist/gca-gui-linux-x86_64
          - os: macos-latest
            artifact: gca-macos-x86_64
            standalone_source: dist/gca
            release_asset: dist/gca-macos-x86_64
            gui_source: dist/gca-gui.app
            gui_release_asset: dist/gca-gui-macos-x86_64.app.zip
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install build dependencies
        run: python -m pip install -e ".[dev,release,gui]" pipx
      - name: Run release tests
        run: python -m pytest tests/e2e
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify wheel in an isolated environment
        run: python scripts/verify_wheel.py
      - name: Verify pipx installation
        run: >-
          python -c "from pathlib import Path; import subprocess, sys;
          wheel=next(Path('dist').glob('*.whl'));
          subprocess.check_call([sys.executable, '-m', 'pipx', 'install', '--force', str(wheel)]);
          subprocess.check_call([sys.executable, '-m', 'pipx', 'run', '--spec', str(wheel),
          'gca', '--version'])"
      - name: Build standalone executable with PyInstaller
        run: pyinstaller --clean --noconfirm gca.spec
      - name: Build GUI standalone with PyInstaller
        run: pyinstaller --clean --noconfirm gca-gui.spec
      - name: Verify standalone executable
        run: python scripts/verify_standalone.py
      - name: Verify GUI standalone executable
        run: python scripts/verify_gui_standalone.py
      - name: Stage uniquely named standalone asset
        env:
          GCA_STANDALONE_SOURCE: ${{ matrix.standalone_source }}
          GCA_RELEASE_ASSET: ${{ matrix.release_asset }}
        run: >-
          python -c "import os, shutil;
          shutil.copy2(os.environ['GCA_STANDALONE_SOURCE'], os.environ['GCA_RELEASE_ASSET'])"
      - name: Stage uniquely named GUI asset
        env:
          GCA_GUI_SOURCE: ${{ matrix.gui_source }}
          GCA_GUI_RELEASE_ASSET: ${{ matrix.gui_release_asset }}
        run: >-
          python -c "import os, shutil; from pathlib import Path;
          source=Path(os.environ['GCA_GUI_SOURCE']);
          target=Path(os.environ['GCA_GUI_RELEASE_ASSET']);
          shutil.make_archive(str(target)[:-4], 'zip', root_dir=source.parent, base_dir=source.name)
          if source.is_dir() else shutil.copy2(source, target)"
      - name: Upload standalone artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.release_asset }}
            ${{ matrix.gui_release_asset }}
          if-no-files-found: error

      - name: Upload Python packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gca-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: standalone
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gca-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ENGLISH_NOTES="doc/releases/${VERSION}.md"
          CHINESE_NOTES="doc/zh-CN/release-${VERSION}.md"
          COMBINED_NOTES="${RUNNER_TEMP}/gca-${VERSION}-release-notes.md"
          test -f "$ENGLISH_NOTES"
          test -f "$CHINESE_NOTES"
          python scripts/build_release_notes.py "$VERSION" "$COMBINED_NOTES"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "GCA $GITHUB_REF_NAME" \
            --notes-file "$COMBINED_NOTES"
