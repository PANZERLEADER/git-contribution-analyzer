name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gca-windows-x86_64
          - os: ubuntu-latest
            artifact: gca-linux-x86_64
          - os: macos-latest
            artifact: gca-macos-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[dev,release]" pipx
      - name: Run release tests
        run: python -m pytest tests/e2e
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify wheel in an isolated environment
        run: python scripts/verify_wheel.py
      - name: Verify pipx installation
        run: >-
          python -c "from pathlib import Path; import subprocess, sys;
          wheel=next(Path('dist').glob('*.whl'));
          subprocess.check_call([sys.executable, '-m', 'pipx', 'install', '--force', str(wheel)]);
          subprocess.check_call([sys.executable, '-m', 'pipx', 'run', '--spec', str(wheel),
          'gca', '--version'])"
      - name: Build standalone executable with PyInstaller
        run: pyinstaller --clean --noconfirm gca.spec
      - name: Verify standalone executable
        run: python scripts/verify_standalone.py
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/gca*
          if-no-files-found: error
