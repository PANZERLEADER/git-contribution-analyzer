name: Bug report
description: Report reproducible incorrect behavior without private repository data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, source code, personal email, reports, or `.gca` databases.
  - type: input
    id: version
    attributes:
      label: GCA version
      placeholder: 0.4.1
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - GUI
        - Python package
        - Standalone artifact
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use a minimal public or synthetic repository and include the command or UI flow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private source, personal email, reports, and `.gca` data.
          required: true
