[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "git-contribution-analyzer"
version = "0.5.1"
description = "Evidence-backed Git contribution analysis with pluggable LLM providers."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Git Contribution Analyzer Contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "portalocker>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pydriller>=2.7,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pre-commit>=4.1,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]
release = [
  "pyinstaller>=6.11,<7",
]
gui = [
  "PySide6>=6.8,<7",
]

[project.scripts]
gca = "git_contribution_analyzer.cli.app:main"
gca-gui = "git_contribution_analyzer.adapters.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_contribution_analyzer"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["git_contribution_analyzer"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["git_contribution_analyzer"]
